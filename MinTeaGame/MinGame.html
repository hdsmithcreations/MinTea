<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minty Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffd699;
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #game {
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            #game-container {
                height: 100vh;
                height: -webkit-fill-available; /* For iOS Safari */
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
