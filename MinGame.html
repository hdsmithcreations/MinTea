<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minty Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffd699;
            overflow: hidden;
            touch-action: none;
            position: relative;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }
        
        #game {
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        #mute-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 1000;
            transition: background-color 0.3s;
        }

        #mute-button:hover {
            background: rgba(255, 255, 255, 1);
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            body {
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
            
            #game-container {
                height: 100%;
                padding: 10px;
                padding-top: 60px; /* Add space for the mute button */
            }
            
            #mute-button {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <button id="mute-button">🔊</button>
    </div>
    <audio id="game-music" loop>
        <source src="https://cdn.jsdelivr.net/gh/hdsmithcreations/MinTea@main/Assets/game-music.wav" type="audio/wav">
    </audio>
    <script src="https://cdn.jsdelivr.net/gh/hdsmithcreations/MinTea@main/game.js"></script>
</body>
</html>
